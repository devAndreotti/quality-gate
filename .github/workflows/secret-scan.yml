# Secret scan em PRs e pushes na main.
# Escopo: árvore de trabalho (--all) e histórico git (--history, linhas
# adicionadas de todos os commits). O histórico exige fetch-depth 0.
name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Secret scan da árvore de trabalho
        run: node scripts/secret-scan.cjs --all

      - name: Secret scan do histórico git
        run: node scripts/secret-scan.cjs --history
