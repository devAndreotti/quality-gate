# Secret scan em PRs e pushes na main.
# Escopo atual: árvore de trabalho (--all). A varredura do histórico git
# (git log -p --all | secret-scan --stdin) depende de um modo stdin que
# scripts/secret-scan.cjs ainda não tem; fica para uma PR futura.
name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Secret scan da árvore de trabalho
        run: node scripts/secret-scan.cjs --all
