# Detecção de testes flaky (advisory): roda a suíte 3 vezes no mesmo checkout e publica o resumo.
# NÃO é required check e NÃO roda em pull_request (custo de CI): só sob demanda e semanalmente.
# continue-on-error mantém o workflow verde mesmo com achados. Não altera a quarentena nem bloqueia nada.
name: Flaky detect

on:
  workflow_dispatch:
  schedule:
    # Segundas-feiras, 06:17 UTC.
    - cron: '17 6 * * 1'

# Uma execução por vez; execuções agendadas não são canceladas no meio.
concurrency:
  group: flaky-detect
  cancel-in-progress: false

# Permissão mínima global: leitura.
permissions:
  contents: read

jobs:
  flaky-detect:
    name: Detecção de flaky (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Advisory: falha aqui não derruba o workflow nem bloqueia merge.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Instalação determinística
        run: npm ci --ignore-scripts

      # O exit code do script é guardado e propagado só depois de publicar o resumo,
      # para o resumo aparecer mesmo quando o script sai com erro de execução.
      - name: Detectar flaky (3 rodadas)
        run: |
          mkdir -p flaky-report
          set +e
          node scripts/flaky-detect.cjs --runs 3 --json-out flaky-report/flaky-report.json > flaky-report/summary.txt 2>&1
          code=$?
          cat flaky-report/summary.txt
          {
            echo '```text'
            cat flaky-report/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Publicar relatório (JSON)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flaky-report
          path: flaky-report/
          retention-days: 14
          if-no-files-found: warn
