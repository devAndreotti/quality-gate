# Verificações extras do quality gate: duplicação de código e artefato do dashboard.
name: Quality Extras

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-extras-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Permissão mínima global: leitura.
permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Duplicação de código (jscpd). Bloqueante: acima de ".jscpd.json > threshold" reprova.
  # ───────────────────────────────────────────────────────────────────────────
  duplication:
    name: Duplicação (código novo)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Instalação determinística
        run: npm ci --ignore-scripts

      - name: jscpd (threshold em .jscpd.json)
        run: npm run -s duplication

  # ───────────────────────────────────────────────────────────────────────────
  # Dependências novas no lockfile (advisory): lista pacotes adicionados/alterados e a idade
  # da versão publicada. NÃO é required check: continue-on-error mantém o job verde mesmo com achados.
  # ───────────────────────────────────────────────────────────────────────────
  lockfile-new-deps:
    name: Dependências novas no lockfile (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Listar dependências novas (advisory)
        run: |
          set -o pipefail
          {
            echo '```text'
            node scripts/lockfile-new-deps.cjs --base origin/main --check-age
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # Dashboard como artefato: HTML estático gerado por scripts/dashboard-publish.cjs.
  # Só em push na main; retenção de 14 dias. Também publica em GitHub Pages
  # (requer Pages habilitado com source "GitHub Actions" nas settings do repo).
  # ───────────────────────────────────────────────────────────────────────────
  dashboard:
    name: Dashboard (artefato + Pages)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Permissões extras só para este job; o padrão global segue em contents: read.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Gerar dashboard/index.html
        run: node scripts/dashboard-publish.cjs

      - name: Publicar artefato
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quality-gate-dashboard
          path: dashboard/index.html
          retention-days: 14
          if-no-files-found: error

      - name: Preparar artefato do GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dashboard

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
