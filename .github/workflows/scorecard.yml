name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Toda segunda-feira, 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

# Permissão mínima global: somente leitura.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Publicar resultados em Code scanning (aba Security).
      security-events: write
      # Necessário para publicar no Scorecard API via OIDC.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Executar OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publica no Scorecard API para o badge público.
          publish_results: true

      - name: Enviar SARIF para Code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
