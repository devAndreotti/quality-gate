name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Toda segunda-feira, 06:00 UTC
    - cron: '0 6 * * 1'

# Cancela rodadas anteriores só em PRs; em main/schedule cada execução roda até o fim.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Permissão mínima global: leitura.
permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    # ubuntu-latest de propósito: código de PR de fork não pode rodar no runner self-hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Única permissão extra: publicar resultados em Code scanning (aba Security).
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          # Sem build: repositório JavaScript puro, o autobuild não é necessário.

      - name: Analisar
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:javascript-typescript
